<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marsa">
  <!--
    Marsa — "مرسى", a berth or anchorage.

    The old mark stacked five things inside 52px: a rotated tile, an offset
    drop-shadow tile, a clipped ochre field, a curved teal wave, a 4px stroke
    and three sheared quadrilaterals. At 32px in a browser tab that resolved to
    a dark smudge, which is the only size a favicon is ever actually seen at.

    This is the same idea drawn to survive that size: a harbour entrance. Two
    piers reaching in from the sides, a channel of water between them, one hull
    at rest inside. Three shapes, no rotation, no stroke, no shadow. It reads at
    16px because there is nothing in it that needs more than 16px to be seen.
  -->
  <rect width="64" height="64" rx="14" fill="#07514D"/>

  <!-- The two piers. The gap between them is the berth. -->
  <path d="M8 20h17v7H8z" fill="#C8912B"/>
  <path d="M39 20h17v7H39z" fill="#C8912B"/>

  <!-- Water: one calm line across the harbour floor. -->
  <path d="M8 44h48v6a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="#0B7A75"/>

  <!-- The moored hull, centred in the channel. -->
  <path d="M20 33h24l-4 8H24z" fill="#FFFFFF"/>
  <rect x="30.5" y="15" width="3" height="18" rx="1.5" fill="#FFFFFF"/>
</svg>
